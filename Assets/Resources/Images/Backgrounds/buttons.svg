<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <!-- Палитра -->
    <linearGradient id="goldButtonDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84E" />
      <stop offset="50%" stop-color="#E7C873" />
      <stop offset="100%" stop-color="#C9A84E" />
    </linearGradient>
    
    <!-- Текстура для кнопки (мелкие крапинки, как на панели) -->
    <pattern id="buttonTexture" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="none"/>
      <!-- Светлые частицы -->
      <circle cx="10" cy="10" r="0.8" fill="#F7F7F5" opacity="0.25"/>
      <circle cx="30" cy="25" r="1" fill="#F7F7F5" opacity="0.2"/>
      <circle cx="15" cy="35" r="0.6" fill="#F7F7F5" opacity="0.15"/>
      <!-- Тёмные частицы -->
      <circle cx="25" cy="5" r="0.7" fill="#1A1A1A" opacity="0.1"/>
      <circle cx="5" cy="30" r="0.5" fill="#1A1A1A" opacity="0.08"/>
      <!-- Золотые искры -->
      <circle cx="35" cy="15" r="0.6" fill="#E7C873" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- КНОПКА 800x110 -->
  <g transform="translate(50, 45)">
    <!-- Основной корпус с диагональным градиентом -->
    <rect x="0" y="0" width="800" height="110" rx="30" ry="30" 
          fill="url(#goldButtonDiagonal)" 
          stroke="#EFEDE7" 
          stroke-width="1.5"/>
    
    <!-- Текстурный слой (каменная крошка) -->
    <rect x="0" y="0" width="800" height="110" rx="30" ry="30" 
          fill="url(#buttonTexture)" 
          opacity="0.3"/>
    
    <!-- Внутренняя обводка для объёма -->
    <rect x="3" y="3" width="794" height="104" rx="27" ry="27" 
          fill="none" 
          stroke="#E7C873" 
          stroke-width="1.2" 
          opacity="0.6"/>
    
    <!-- Декоративные элементы по углам (маленькие искры) -->
    <!-- Левый верхний угол -->
    <circle cx="40" cy="30" r="5" fill="#F7F7F5" opacity="0.15"/>
    <circle cx="55" cy="45" r="3" fill="#E7C873" opacity="0.3"/>
    
    <!-- Правый верхний угол -->
    <circle cx="760" cy="30" r="5" fill="#F7F7F5" opacity="0.15"/>
    <circle cx="745" cy="45" r="3" fill="#E7C873" opacity="0.3"/>
    
    <!-- Левый нижний угол -->
    <circle cx="40" cy="80" r="4" fill="#E7C873" opacity="0.25"/>
    <circle cx="55" cy="65" r="2.5" fill="#F7F7F5" opacity="0.2"/>
    
    <!-- Правый нижний угол -->
    <circle cx="760" cy="80" r="4" fill="#E7C873" opacity="0.25"/>
    <circle cx="745" cy="65" r="2.5" fill="#F7F7F5" opacity="0.2"/>
    
    <!-- Маленькие золотые точки по краям (для магии) -->
    <circle cx="20" cy="55" r="2" fill="#E7C873" opacity="0.4"/>
    <circle cx="780" cy="55" r="2" fill="#E7C873" opacity="0.4"/>
    <circle cx="400" cy="15" r="2.5" fill="#F7F7F5" opacity="0.2"/>
    <circle cx="400" cy="95" r="2.5" fill="#F7F7F5" opacity="0.2"/>
  </g>

</svg>